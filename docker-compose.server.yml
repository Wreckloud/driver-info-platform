name: driver_info_platform

services:
  api:
    image: driver-info-platform-api:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: deploy/server/Dockerfile.api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://${EXISTING_MYSQL_HOST:-lycan-mysql}:3306/${MYSQL_DATABASE:-driver_info}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_BCRYPT: ${ADMIN_PASSWORD_BCRYPT:?ADMIN_PASSWORD_BCRYPT is required}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:?TENCENT_MAP_KEY is required}
      SESSION_COOKIE_SECURE: "true"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      KNIFE4J_ENABLE: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
      TZ: UTC
    mem_limit: 512m
    pids_limit: 256
    networks:
      - app
      - existing_mysql
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: driver-info-platform-web:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: deploy/server/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DRIVER_WEB_PORT:-18080}:80"
    mem_limit: 64m
    pids_limit: 128
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/driver"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  app:
  existing_mysql:
    external: true
    name: ${EXISTING_MYSQL_NETWORK:-deploy_lycan_net}
